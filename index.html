<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NwSSU Computer Engineering Organization student portal for announcements, events, resources, and academic opportunities."
    />
    <meta name="theme-color" content="#f7f9fc" />
    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('nwssu-theme')
          const isDark = savedTheme === 'dark'

          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark
            ? 'dark'
            : 'light'
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', isDark ? '#060d19' : '#f7f9fc')
        } catch {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
    <link rel="icon" type="image/png" href="/images/nwssu-cpe-logo.png" />
    <title>NwSSU Computer Engineering Organization</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
