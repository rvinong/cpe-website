<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NwSSU Computer Engineering Organization student portal for announcements, events, resources, and academic opportunities."
    />
    <meta name="theme-color" content="#0b1f46" />
    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('nwssu-theme')
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          const isDark = savedTheme ? savedTheme === 'dark' : prefersDark

          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark
            ? 'dark'
            : 'light'
        } catch {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
    <link rel="icon" type="image/png" href="/images/nwssu-cpe-logo.png" />
    <title>NwSSU Computer Engineering Organization</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
